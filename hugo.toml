baseURL = "https://songfall.github.io/"
defaultContentLanguage = "en"
theme = "PaperMod"

enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 8

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  author = "SongFall"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCounts = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  displayFullLangName = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    title = "SongFall's Blog"

    [languages.en.params]
      description = "SongFall's personal blog about tech, learning and life."

      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm SongFall 👋"
        Content = "Welcome to my personal blog about tech, learning and life."

    [[languages.en.menu.main]]
      name = "Posts"
      url = "/posts/"
      weight = 10

    [[languages.en.menu.main]]
      name = "Archives"
      url = "/archives/"
      weight = 20

    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 30

    [[languages.en.menu.main]]
      name = "Search"
      url = "/search/"
      weight = 40

  [languages.zh-cn]
    label = "中文"
    locale = "zh-cn"
    weight = 2
    title = "SongFall 的个人博客"

    [languages.zh-cn.params]
      description = "SongFall 的个人博客，记录技术、学习与生活。"

      [languages.zh-cn.params.homeInfoParams]
        Title = "你好，我是 SongFall 👋"
        Content = "欢迎来到我的个人博客，这里记录技术、学习与生活。"

    [[languages.zh-cn.menu.main]]
      name = "文章"
      url = "/posts/"
      weight = 10

    [[languages.zh-cn.menu.main]]
      name = "归档"
      url = "/archives/"
      weight = 20

    [[languages.zh-cn.menu.main]]
      name = "标签"
      url = "/tags/"
      weight = 30

    [[languages.zh-cn.menu.main]]
      name = "搜索"
      url = "/search/"
      weight = 40

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
